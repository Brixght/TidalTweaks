<!DOCTYPE html>
<!--
  TidalTweaks — crosshair overlay window (separate transparent always-on-top).
  Fullscreen + transparent + frameless. Click-through by default; holding Alt
  makes it movable so Alt+drag repositions the drawing. Rendered with inline
  SVG (crisp at any size, zero deps). Receives live config via
  'crosshair:update' pushed from core/crosshair.js.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
<title>TidalTweaks Crosshair Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  body.movable { cursor: move; }
  /* Fullscreen drag surface. -webkit-app-region is NOT used (window is
     fullscreen + movable:false); dragging moves the DRAWING via IPC deltas. */
  #stage { position: fixed; inset: 0; background: transparent; }
  #stage svg { display: block; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font: 600 12px 'Segoe UI', system-ui, sans-serif;
    color: rgba(255,255,255,0.85); background: rgba(10,16,32,0.72);
    border: 1px solid rgba(157,123,255,0.5); border-radius: 8px;
    padding: 6px 12px; display: none; pointer-events: none;
    white-space: nowrap;
  }
  body.movable #hint { display: block; }
</style>
</head>
<body>
<div id="stage"><svg id="ch-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="hint">Alt+drag to move · release Alt to lock · Ctrl+Alt+Shift+R to recenter</div>
<script>
(function () {
  'use strict';
  var svg = document.getElementById('ch-svg');
  var NS = 'http://www.w3.org/2000/svg';
  var cfg = null;
  var movable = false;
  var dragging = false;
  var lastX = 0, lastY = 0;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  /* Draw one layer shape centered at (cx, cy). Returns SVGElement group. */
  function drawShape(g, shape, cx, cy, size, thick, color, opacity) {
    var s = Number(size) || 22;
    var t = Number(thick) || 3;
    var half = s / 2;
    var gap = Math.max(2, s * 0.22);
    function line(x1, y1, x2, y2) {
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', color);
      l.setAttribute('stroke-width', t);
      l.setAttribute('stroke-linecap', 'round');
      l.setAttribute('opacity', opacity);
      g.appendChild(l);
    }
    function circle(r, fill, strokeW) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
      c.setAttribute('fill', fill ? color : 'none');
      c.setAttribute('fill-opacity', fill ? opacity : 0);
      if (!fill) { c.setAttribute('stroke', color); c.setAttribute('stroke-width', strokeW || t); c.setAttribute('opacity', opacity); }
      g.appendChild(c);
    }
    // Subtle dark outline for visibility on bright games (drawn first).
    function outline(fn) { fn(); }
    if (shape === 'dot') {
      circle(Math.max(2, s * 0.22), true);
    } else if (shape === 'cross') {
      var d = half * 0.75;
      line(cx - d, cy - d, cx + d, cy + d);
      line(cx - d, cy + d, cx + d, cy - d);
    } else if (shape === 't-shape') {
      line(cx - half, cy - half, cx + half, cy - half);
      line(cx, cy - half, cx, cy + half);
    } else if (shape === 'ring') {
      circle(half, false);
      circle(1.6, true);
    } else if (shape === 'double') {
      circle(half, false);
      circle(half * 0.55, false, Math.max(1.5, t * 0.7));
      circle(1.6, true);
    } else if (shape === 'plus-dot') {
      line(cx - half, cy, cx - gap, cy);
      line(cx + gap, cy, cx + half, cy);
      line(cx, cy - half, cx, cy - gap);
      line(cx, cy + gap, cx, cy + half);
      circle(Math.max(1.8, t * 0.7), true);
    } else if (shape === 'complex') {
      line(cx - half, cy, cx - gap, cy);
      line(cx + gap, cy, cx + half, cy);
      line(cx, cy - half, cx, cy - gap);
      line(cx, cy + gap, cx, cy + half);
      circle(half * 0.72, false, Math.max(1.2, t * 0.55));
      circle(1.6, true);
    } else { // 'classic' default
      line(cx - half, cy, cx - gap, cy);
      line(cx + gap, cy, cx + half, cy);
      line(cx, cy - half, cx, cy - gap);
      line(cx, cy + gap, cx, cy + half);
    }
  }

  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!cfg || !cfg.enabled) return;
    var W = window.innerWidth || 1920;
    var H = window.innerHeight || 1080;
    var baseX = W / 2 + (Number(cfg.x) || 0);
    var baseY = H / 2 + (Number(cfg.y) || 0);
    var color = (cfg.color && /^#[0-9a-fA-F]{6}$/.test(cfg.color)) ? cfg.color : '#22FF88';
    var layers = (cfg.layers && cfg.layers.length) ? cfg.layers : [{ shape: cfg.preset || 'classic', size: cfg.size || 22, thickness: cfg.thickness || 3, opacity: cfg.opacity != null ? cfg.opacity : 1, x: 0, y: 0, visible: true }];
    // Drop shadow filter for readability (cheap, one filter).
    var defs = document.createElementNS(NS, 'defs');
    defs.innerHTML = '<filter id="ch-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="black" flood-opacity="0.9"/></filter>';
    svg.appendChild(defs);
    layers.forEach(function (l) {
      if (l.visible === false) return;
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('filter', 'url(#ch-shadow)');
      var cx = baseX + (Number(l.x) || 0);
      var cy = baseY + (Number(l.y) || 0);
      drawShape(g, l.shape || 'classic', cx, cy, l.size || 22, l.thickness || 3, color, (l.opacity != null ? l.opacity : 1));
      svg.appendChild(g);
    });
  }

  function setMovable(m) {
    m = !!m;
    if (m === movable) return;
    movable = m;
    document.body.classList.toggle('movable', m);
    try {
      if (window.api && window.api.crosshair && window.api.crosshair.setMovable) {
        window.api.crosshair.setMovable(m).catch(function () {});
      }
    } catch (e) { /* ignore */ }
  }

  /* Alt+drag: key handlers run when the overlay can receive keys (setup /
     borderless focus). The main process ALSO mirrors Alt state globally where
     possible; both paths funnel into setMovable + nudge. */
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Alt' || e.altKey) setMovable(true);
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'Alt' || !e.altKey) setMovable(false);
  });
  window.addEventListener('blur', function () { setMovable(false); dragging = false; });

  document.getElementById('stage').addEventListener('mousedown', function (e) {
    if (!movable) return;
    dragging = true; lastX = e.screenX; lastY = e.screenY;
    e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) {
    if (!movable || !dragging) return;
    var dx = e.screenX - lastX, dy = e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    if ((dx || dy) && window.api && window.api.crosshair && window.api.crosshair.nudge) {
      window.api.crosshair.nudge(dx, dy).catch(function () {});
    }
  });
  window.addEventListener('mouseup', function () { dragging = false; });
  window.addEventListener('resize', render);

  function applyConfig(c) { cfg = c; render(); }

  async function boot() {
    try {
      if (window.api && window.api.crosshair) {
        if (window.api.crosshair.onUpdate) {
          window.api.crosshair.onUpdate(applyConfig);
        }
        var r = await window.api.crosshair.get();
        if (r && r.config) applyConfig(r.config);
        else if (r && r.ok === false) applyConfig(null);
      }
    } catch (e) { /* overlay stays transparent */ }
  }
  boot();
})();
</script>
</body>
</html>
