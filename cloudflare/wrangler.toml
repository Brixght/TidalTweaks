# Only needed if you deploy with the Wrangler CLI instead of the dashboard.
# 1. npm install -g wrangler && wrangler login
# 2. Create a KV namespace:  wrangler kv:namespace create CODES
#    (do it twice if you want separate preview/production namespaces)
# 3. Paste the production namespace `id` below.
# 4. Deploy this folder:  wrangler pages deploy . --project-name=tidaltweaks
# 5. Upload codes:  wrangler kv:bulk put --binding=CODES kv-import-base.json
#    (run from the folder holding your code files)

name = "tidaltweaks"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "CODES"
id = "PASTE-YOUR-KV-NAMESPACE-ID-HERE"
